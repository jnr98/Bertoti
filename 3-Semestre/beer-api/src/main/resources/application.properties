# ===== BANCO DE DADOS H2 =====

# Nome do banco em memória
spring.datasource.url=jdbc:h2:mem:beerdb

# Driver do H2
spring.datasource.driver-class-name=org.h2.Driver

# Usuário e senha padrão
spring.datasource.username=sa
spring.datasource.password=

# ===== CONSOLE H2 (interface visual do banco) =====

# Ativa o console web
spring.h2.console.enabled=true

# Endereço do console → acesse: http://localhost:8080/h2-console
spring.h2.console.path=/h2-console

# ===== JPA / HIBERNATE =====

# Cria/atualiza tabelas automaticamente baseado nas entidades
spring.jpa.hibernate.ddl-auto=update

# Mostra o SQL gerado no terminal (útil pra debugar)
spring.jpa.show-sql=true

# Dialeto do H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect